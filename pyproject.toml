[project]
name = "thinknxg_workspace_studio"
version = "0.2.1"
description = "Administrator workspace designer for ERPNext/Frappe v16"
authors = [{name = "thinkNXG"}]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "thinknxg_workspace_studio"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"
