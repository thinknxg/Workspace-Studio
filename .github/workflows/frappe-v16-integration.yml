name: Frappe ERPNext v16 native publishing
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable MariaDB, Redis and ERPNext v16 containers
        run: docker compose -f tests/ci/compose.yml up -d --wait
      - name: Install Workspace Studio on a fresh ERPNext site
        run: |
          docker compose -f tests/ci/compose.yml exec -T backend bash -euc '
            bench pip install -e apps/thinknxg_workspace_studio
            ls -1 apps > sites/apps.txt
            bench set-config -g db_host db
            bench set-config -gp db_port 3306
            bench set-config -g redis_cache redis://redis:6379/0
            bench set-config -g redis_queue redis://redis:6379/1
            bench set-config -g redis_socketio redis://redis:6379/2
            bench new-site studio.local --mariadb-user-host-login-scope="%" --admin-password=integration-only --db-root-username=root --db-root-password=integration-only --install-app erpnext
            bench --site studio.local install-app thinknxg_workspace_studio
            bench --site studio.local list-apps
          '
      - name: Exercise real native publishing, runtime visibility and rollback
        run: |
          docker compose -f tests/ci/compose.yml exec -T backend bash -euc '
            env/bin/python apps/thinknxg_workspace_studio/tests/ci/integration.py
          '
      - name: Record container logs
        if: always()
        run: docker compose -f tests/ci/compose.yml logs --no-color > integration-containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frappe-v16-integration-logs
          path: integration-containers.log
      - name: Remove disposable environment
        if: always()
        run: docker compose -f tests/ci/compose.yml down -v
