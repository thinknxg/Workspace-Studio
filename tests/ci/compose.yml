services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: integration-only
      MARIADB_ROOT_HOST: '%'
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake, --innodb-snapshot-isolation=OFF]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
  backend:
    image: frappe/erpnext:v16.51.0
    entrypoint: [bash, -c]
    command: [sleep infinity]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - ../..:/home/frappe/frappe-bench/apps/thinknxg_workspace_studio:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  sites:
